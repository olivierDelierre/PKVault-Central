name: Fork build (Android APK + server image)

# Builds what is needed to try the remote bank, and publishes it:
# - the signed Android APK, attached to a GitHub release (Obtainium reads it from there)
# - the server image, on the GitHub container registry of the owner of the repository
#
# Run it by pushing a tag:   git tag remote-bank-1 && git push origin remote-bank-1
# or from the Actions tab ("Run workflow") once this file is on the default branch.
#
# Needs 3 repository secrets (Settings > Secrets and variables > Actions), see
# docs/technical/remote-bank-publishing.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEYSTORE_ALIAS

on:
  push:
    tags:
      - "remote-bank-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Name of the release to create, ex: remote-bank-2"
        required: true
        type: string

permissions:
  contents: write # release
  packages: write # container registry

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the signing key is set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set: see docs/technical/remote-bank-publishing.md"
            exit 1
          fi

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          docker build . --target mobile-android \
            --build-arg VERSION="$VERSION" \
            --build-arg ANDROID_KEYSTORE_BASE64="$ANDROID_KEYSTORE_BASE64" \
            --build-arg ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            --build-arg ANDROID_KEYSTORE_ALIAS="$ANDROID_KEYSTORE_ALIAS" \
            -t tmp-mobile-android
          mkdir -p _export
          docker create --name tmp-mobile-android tmp-mobile-android
          docker cp tmp-mobile-android:/app/pkvault.apk "_export/pkvault-$TAG.apk"
          docker rm tmp-mobile-android
          ls -la _export

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: _export/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Name of the image
        run: |
          # the registry only accepts lower case
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pkvault" >> "$GITHUB_ENV"
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: monolith
          platforms: linux/amd64
          push: true
          # the name of the release, and a name which always points to the latest build
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:remote-bank
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: _export

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: _export/*.apk
