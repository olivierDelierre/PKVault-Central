services:
  pkvault:
    image: ghcr.io/chnapy/pkvault:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkvault
    ports:
      - "3000:3000"
    # environment:
    #   # optional: requires "Authorization: Bearer <token>" for every /api request,
    #   # use it with HTTPS or a VPN when reachable from outside your network
    #   - PKVAULT_API_TOKEN=change-me
    volumes:
      - ./pkvault-data:/pkvault

      # you must add in app settings save paths: /pkvault/saves/
      - ./pkvault-saves:/pkvault/saves
